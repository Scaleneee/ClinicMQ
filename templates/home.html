{% extends "base.html" %}

{% block content %}
  <div class="cmq-narrow text-center py-5">
    <p class="cmq-eyebrow">Clinic Management System with Online Queue</p>
    <h1 class="cmq-title">Wait at home, not in the clinic.</h1>
    <p class="cmq-subtitle mb-4">Take a queue number online and track your turn live on your phone.</p>
    {% if user.is_authenticated %}
      <a class="btn btn-primary btn-lg" href="{% url 'dashboard' %}">Go to dashboard</a>
    {% else %}
      <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
        <a class="btn btn-primary btn-lg px-4" href="{% url 'login' %}"><i class="bi bi-box-arrow-in-right"></i> Log in</a>
        <a class="btn btn-secondary btn-lg px-4" href="{% url 'register' %}"><i class="bi bi-person-plus"></i> Register</a>
      </div>
    {% endif %}
  </div>
{% endblock %}
