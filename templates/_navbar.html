{% with url_name=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-lg cmq-navbar">
  <div class="container-xl">
    <a class="cmq-wordmark" href="{% url 'home' %}">ClinicMQ</a>

    {% if user.is_authenticated %}
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cmqNav"
              aria-controls="cmqNav" aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>

      <div class="collapse navbar-collapse" id="cmqNav">
        {# Role menus (UI.md §4) are added here as each module's pages are built. #}
        <ul class="navbar-nav mx-auto gap-lg-3">
          <li class="nav-item">
            <a class="nav-link {% if url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
              <i class="bi bi-grid"></i> Dashboard
            </a>
          </li>
        </ul>

        <div class="dropdown">
          <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            {{ user.get_full_name }}
            <span class="cmq-user-role">[{{ user.get_role_display }}]</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right"></i> Logout</button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    {% endif %}
  </div>
</nav>
{% endwith %}
